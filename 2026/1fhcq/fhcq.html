<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>凤凰传奇演唱会歌词本</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
--main:#c82423;
--main-dark:#9e1b1a;
--main-light:#f8d4d4;
--bg-base:#faf4f4;
--card:#ffffff;
--text:#1a1a2e;
--text-mid:#6b6b7b;
--text-light:#9999a8;
--border:#f2e0e0;
--radius:16px;
--shadow-soft: 0 4px 18px rgba(158,27,26,0.08);
--shadow-glow: 0 6px 22px rgba(200,36,35,0.12);
}
.font-songti{
font-family:
"SimSun",
"宋体",
"Songti SC",
"PingFang SC",
"Noto Serif CJK SC",
"Source Han Serif SC",
"Microsoft YaHei",
sans-serif;
}
html,body{
font-family:"SimSun","宋体",system-ui,-apple-system,BlinkMacSystemFont,Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
background:var(--bg-base);
color:var(--text);
height:100%;
overflow:hidden;
}
#app{
width:100%;
height:100%;
position:relative;
}
.page{
width:100%;
height:100%;
position:absolute;
top:0;
left:0;
display:none;
overflow-y:auto;
overflow-x:hidden;
-webkit-overflow-scrolling:touch;
}
.page.active{
display:block;
}

/* ==========首页标题区域：左右结构 ========== */
#list-page{
position:relative;
}
#list-page::before{
content:"";
position:absolute;
top:-120px;
right:-100px;
width:320px;height:320px;
background:radial-gradient(circle, rgba(248,212,212,0.35) 0%, transparent 70%);
pointer-events:none;
animation:breath 8s ease-in-out infinite alternate;
}
#list-page::after{
content:"";
position:absolute;
bottom:-140px;
left:-80px;
width:280px;height:280px;
background:radial-gradient(circle, rgba(245,200,200,0.28) 0%, transparent 70%);
pointer-events:none;
animation:breath 9s ease-in-out infinite alternate-reverse;
}
@keyframes breath{
0%{opacity:0.6;transform:scale(1)}
100%{opacity:1;transform:scale(1.08)}
}
.list-header{
position:relative;
padding:50px 22px 24px;
background:linear-gradient(180deg,#fbe8e8 0%,rgba(250,244,244,0) 100%);
overflow:hidden;
}
.list-header::before{
content:"❀";
position:absolute;
top:24px;
left:6%;
font-size:22px;
color:rgba(200,36,35,0.18);
}
.list-header::after{
content:"✿";
position:absolute;
bottom:8px;
right:8%;
font-size:26px;
color:rgba(200,36,35,0.15);
}
.list-header-inner{
display:flex;
align-items:center;
gap:18px;
position:relative;
z-index:2;
}
.tape{
width:106px;
height:70px;
flex-shrink:0;
position:relative;
filter:drop-shadow(0 2px 8px rgba(158,27,26,0.15));
}
.tape svg{
width:100%;
height:100%;
}
.list-header-text{
flex:1;
min-width:0;
}
.list-header h1{
font-size:26px;
font-weight:bold;
color:var(--main-dark);
line-height:1.35;
letter-spacing:1px;
font-family:"SimSun","宋体","Songti SC","PingFang SC","Noto Serif CJK SC",serif;
}
.list-header .sub{
font-size:16px;
color:var(--text-mid);
margin-top:8px;
letter-spacing:0.5px;
font-family:"SimSun","宋体","Songti SC","PingFang SC","Noto Serif CJK SC",serif;
}
/* 搜索吸顶栏：无阴影 */
.search-sticky-wrap{
position:sticky;
top:0;
z-index:12;
background:rgba(250,244,244,0.72);
backdrop-filter:blur(16px);
-webkit-backdrop-filter:blur(16px);
padding:12px 0 14px;
box-shadow:none;
}
.search-box{
margin:0 18px;
position:relative;
}
.search-box input{
width:100%;
padding:13px 46px 13px 40px;
border-radius:28px;
border:1px solid rgba(242,224,224,0.65);
background:rgba(255,255,255,0.78);
font-size:15px;
outline:none;
color:var(--text);
font-family:"SimSun","宋体","Songti SC","PingFang SC","Noto Serif CJK SC",serif;
box-shadow:var(--shadow-soft);
}
.search-box input::placeholder{color:var(--text-light)}
.search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--text-light)}
.search-clear{
position:absolute;right:14px;
top:50%;
transform:translateY(-50%);
width:24px;height:24px;
border-radius:50%;
background:rgba(221,221,221,0.6);
color:#333;
display:flex;align-items:center;justify-content:center;
font-size:15px;
cursor:pointer;
backdrop-filter:blur(4px);
}
.section-title{padding:0 20px;margin-bottom:12px;font-size:13px;color:var(--text-mid);display:flex;align-items:center;gap:10px;font-family:"SimSun","宋体","Songti SC","PingFang SC","Noto Serif CJK SC",serif;}
.section-title::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--border),transparent)}
.song-list{padding:0 18px 40px}
.song-item{
background:rgba(255,255,255,0.76);
border-radius:var(--radius);
padding:16px 16px;
margin-bottom:12px;
box-shadow:var(--shadow-soft);
display:flex;
align-items:center;
gap:14px;
cursor:pointer;
font-family:"SimSun","宋体","Songti SC","PingFang SC","Noto Serif CJK SC",serif;
border:1px solid rgba(242,224,224,0.55);
transition:all 0.24s ease;
backdrop-filter:blur(6px);
}
.song-item:active{
transform:scale(0.97);
box-shadow:var(--shadow-glow);
background:rgba(255,255,255,0.92);
}
.song-index{
padding:3px 10px;
border-radius:8px;
font-size:12px;
font-weight:bold;
flex-shrink:0;
background:rgba(248,212,212,0.85);
color:var(--main-dark);
min-width:36px;
text-align:center;
font-family:"SimSun","宋体","Songti SC","PingFang SC","Noto Serif CJK SC",serif;
}
.song-name{font-size:16px;font-weight:bold;color:var(--text);flex:1;font-family:"SimSun","宋体","Songti SC","PingFang SC","Noto Serif CJK SC",serif;}
.song-arrow{color:var(--text-light)}
.empty-state{text-align:center;padding:60px 20px;color:var(--text-light);font-size:14px;font-family:"SimSun","宋体","Songti SC","PingFang SC","Noto Serif CJK SC",serif;}

/* ==========歌词详情页 ========== */
#detail-page{
background:
radial-gradient(circle at 15% 12%, rgba(248,212,212,0.25) 0%, transparent 55%),
radial-gradient(circle at 85% 88%, rgba(245,200,200,0.20) 0%, transparent 55%),
linear-gradient(180deg,#fbe8e8 0%,#faf4f4 40%,#fff8f8 100%);
position:relative;
padding-left:max(18px, env(safe-area-inset-left));
padding-right:max(18px, env(safe-area-inset-right));
padding-bottom:140px;
}
#detail-page::before{
content:"";
position:absolute;
top:-100px;left:-90px;
width:260px;height:260px;
background:radial-gradient(circle, rgba(240,205,205,0.22) 0%,transparent 70%);
pointer-events:none;
}
#detail-page::after{
content:"";
position:absolute;
bottom:-120px;right:-100px;
width:300px;height:300px;
background:radial-gradient(circle, rgba(238,198,198,0.18) 0%,transparent 70%);
pointer-events:none;
}
.float-back-btn{
position:fixed;
top:18px;
left:18px;
z-index:99;
width:42px;height:42px;
border-radius:50%;
border:1px solid rgba(230,204,204,0.6);
background:rgba(255,255,255,0.64);
backdrop-filter:blur(14px);
-webkit-backdrop-filter:blur(14px);
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
box-shadow:0 4px 16px rgba(0,0,0,0.10);
transition:transform 0.2s ease,background 0.2s ease;
}
.float-back-btn:active{
transform:scale(0.92);
background:rgba(255,255,255,0.86);
}
.float-back-btn svg{width:21px;height:21px;color:#222}

/* 标题区 */
.detail-hero{
padding:24px 0 14px;
text-align:center;
position:relative;
z-index:2;
}
.detail-hero h1{
font-size:28px;
font-weight:bold;
color:var(--main-dark);
font-family:"SimSun","宋体","Songti SC","PingFang SC","Noto Serif CJK SC",serif;
letter-spacing:2px;
}

.lyrics-body{
position:relative;
z-index:2;
max-width:380px;
width:100%;
margin:0 auto 40px;
padding:32px max(24px,env(safe-area-inset-left)) 32px max(24px,env(safe-area-inset-right));
border-radius:22px;
background:rgba(255,255,255,0.82);
backdrop-filter:blur(18px);
-webkit-backdrop-filter:blur(18px);
line-height:2.5;
font-size:17px;
color:#242438;
white-space:pre-wrap;
text-align:center;
font-family:"SimSun","宋体","Songti SC","PingFang SC","Noto Serif CJK SC",serif;
border:1px solid rgba(255,255,255,0.9);
box-shadow:
0 10px 28px rgba(158,27,26,0.13),
0 4px 10px rgba(0,0,0,0.05);
}

/* 底部操作栏，按钮内部包含文字+歌名，单行溢出省略 */
.detail-nav{
position:fixed;
bottom:0;left:0;right:0;
padding:14px 18px 30px;
background:linear-gradient(0deg,rgba(255,255,255,0.92) 55%,transparent);
display:flex;
gap:14px;
z-index:20
}
.nav-col{
flex:1;
}
.nav-btn{
width:100%;
padding:13px 12px;
border-radius:28px;
border:1px solid rgba(242,224,224,0.6);
background:rgba(255,255,255,0.74);
font-size:14px;
font-weight:bold;
color:var(--text);
display:flex;
align-items:center;
justify-content:center;
gap:6px;
cursor:pointer;
box-shadow:0 3px 12px rgba(0,0,0,0.06);
font-family:"SimSun","宋体","Songti SC","PingFang SC","Noto Serif CJK SC",serif;
backdrop-filter:blur(8px);
transition:transform 0.2s ease;
/* 单行溢出省略核心 */
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}
.nav-btn:active{transform:scale(0.96)}
.nav-btn.primary{
background:linear-gradient(135deg,var(--main),var(--main-dark));
color:#fff;
border-color:transparent;
box-shadow:0 4px 16px rgba(158,27,26,0.25);
}
.nav-btn:disabled{opacity:0.32;cursor:not-allowed;transform:none;box-shadow:none}
.nav-btn svg{width:16px;height:16px;flex-shrink:0;}
</style>
</head>
<body>
<div id="app">
<!-- 歌单列表页（默认首页） -->
<div id="list-page" class="page active">
<div class="list-header">
<div class="list-header-inner">
<div class="tape">

</div>
<div class="search-sticky-wrap" id="stickyBar">

</div>
</div>
<div class="section-title" id="listTitle">全部 <span id="totalCount">0</span>首</div>
<div class="song-list" id="songList"></div>
</div>

<!-- 歌词详情页面 -->
<div id="detail-page" class="page">
<div class="float-back-btn" onclick="goPage('list-page')">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg>
</div>
<div class="detail-hero">
<h1 id="songSubTitle"></h1>
</div>
<div class="lyrics-body" id="lyricsBody"></div>

<div class="detail-nav">
    <div class="nav-col">
        <button class="nav-btn" id="btnPrev" onclick="prevSong()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M5 12l7-7M5 12l7 7" /></svg>
            <span id="btnPrevText">上一首</span>
        </button>
    </div>
    <div class="nav-col">
        <button class="nav-btn primary" id="btnNext" onclick="nextSong()">
            <span id="btnNextText">下一首</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M19 12l-7-7M19 12l-7 7" /></svg>
        </button>
    </div>
</div>
</div>
</div>

let currentSongIdx = 0;
const songListBox = document.getElementById('songList');
const songSubTitle = document.getElementById('songSubTitle');
const lyricText = document.getElementById('lyricsBody');
const btnPrev = document.getElementById('btnPrev');
const btnNext = document.getElementById('btnNext');
const btnPrevText = document.getElementById('btnPrevText');
const btnNextText = document.getElementById('btnNextText');
const searchInput = document.getElementById('searchInput');
const detailPageEl = document.getElementById('detail-page');
const totalCountEl = document.getElementById('totalCount');

//页面切换，重置容器滚动到顶部
function goPage(pageId){
    document.querySelectorAll('.page').forEach(p=>{
        p.classList.remove('active');
        p.scrollTop = 0;
    });
    const activePage = document.getElementById(pageId);
    activePage.classList.add('active');
    activePage.scrollTop = 0;
}

function clearSearch(){
    searchInput.value = '';
    filterSongs();
}

function renderSongList(list){
    songListBox.innerHTML = '';
    totalCountEl.innerText = songs.length;
    if(!list.length){
        songListBox.innerHTML = `<div class="empty-state">没有找到相关歌曲</div>`;
        return;
    }
    list.forEach((item)=>{
        const realIndex = songs.indexOf(item);
        const div = document.createElement('div');
        div.className = 'song-item';
        div.innerHTML = `
            <span class="song-index">${realIndex+1}</span>
            <span class="song-name">${item.name}</span>
            <span class="song-arrow">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M9 18l6-6-6-6" />
                </svg>
            </span>`;
        div.onclick = ()=>{
            currentSongIdx = realIndex;
            renderLyric();
            goPage('detail-page');
        };
        songListBox.appendChild(div);
    })
}

//渲染歌词，按钮内部文字：上一首《歌名》，溢出自动...；边界只显示“上一首”/“下一首”
function renderLyric(){
    if(!songs.length) return;
    const song = songs[currentSongIdx];
    songSubTitle.innerText = song.name;
    lyricText.innerText = song.lyrics;
    detailPageEl.scrollTop = 0;

    //上一首按钮文字
    if(currentSongIdx>0){
        btnPrevText.innerText = `上一首《${songs[currentSongIdx-1].name}》`;
    }else{
        btnPrevText.innerText = `上一首`;
    }
    //下一首按钮文字
    if(currentSongIdx < songs.length-1){
        btnNextText.innerText = `下一首《${songs[currentSongIdx+1].name}》`;
    }else{
        btnNextText.innerText = `下一首`;
    }

    btnPrev.disabled = currentSongIdx <= 0;
    btnNext.disabled = currentSongIdx >= songs.length - 1;
}

function prevSong(){
    if(currentSongIdx > 0){
        currentSongIdx -=1;
        renderLyric();
    }
}
function nextSong(){
    if(currentSongIdx < songs.length - 1){
        currentSongIdx +=1;
        renderLyric();
    }
}

function filterSongs(){
    const kw = searchInput.value.trim().toLowerCase();
    let arr = [...songs];
    if(kw){
        arr = arr.filter(s=> s.name.toLowerCase().includes(kw) || s.lyrics.toLowerCase().includes(kw));
    }
    renderSongList(arr);
}

renderSongList(songs);
if(songs.length>0) renderLyric();
</script>
