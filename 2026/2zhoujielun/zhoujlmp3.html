<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>周杰伦｜演唱会歌词速查手册</title>
<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

:root{
--main:#c084fc;
--main-dark:#581c87;
--main-darker:#1e1b4b;
--main-light:#e9d5ff;
--accent:#ec4899;
--bg-base:#030712;
--bg-deep:#020617;
--card:rgba(192,132,252,0.08);
--card-strong:rgba(192,132,252,0.16);
--text:#f8fafc;
--text-soft:#e2e8f0;
--text-mid:#94a3b8;
--text-light:#475569;
--border:rgba(192,132,252,0.25);
--radius:18px;
--shadow-soft: 0 4px 18px rgba(192,132,252,0.15);
--shadow-glow: 0 8px 28px rgba(192,132,252,0.28);
--glow: 0 0 22px rgba(192,132,252,0.35);
}

html,body{
font-family:"PingFang SC","Microsoft YaHei",system-ui,-apple-system,BlinkMacSystemFont,sans-serif;
background:var(--bg-base);
color:var(--text);
height:100%;
overflow:hidden;
}

#app{
width:100%;
height:100%;
position:relative;
}

.page{
width:100%;
height:100%;
position:absolute;
top:0;
left:0;
display:none;
overflow-y:auto;
overflow-x:hidden;
-webkit-overflow-scrolling:touch;
}
.page.active{
display:block;
}

/* ==========首页 ========== */
#list-page{
position:relative;
}
#list-page::before{
content:"";
position:absolute;
top:-140px;
right:-120px;
width:380px;height:380px;
background:radial-gradient(circle, rgba(192,132,252,0.28) 0%, transparent 70%);
pointer-events:none;
animation:breath 8s ease-in-out infinite alternate;
}
#list-page::after{
content:"";
position:absolute;
bottom:-160px;
left:-100px;
width:340px;height:340px;
background:radial-gradient(circle, rgba(236,72,153,0.18) 0%, transparent 70%);
pointer-events:none;
animation:breath 9s ease-in-out infinite alternate-reverse;
}
@keyframes breath{
0%{opacity:0.45;transform:scale(1)}
100%{opacity:0.9;transform:scale(1.12)}
}

.list-header{
position:relative;
padding:50px 22px 24px;
background:linear-gradient(180deg,rgba(30,27,75,0.92) 0%,rgba(3,7,18,0) 100%);
overflow:hidden;
}
.list-header::before{
content:"";
position:absolute;
top:22px;
left:6%;
width:72px;height:2px;
background:linear-gradient(90deg,transparent,var(--main),transparent);
opacity:0.45;
}
.list-header::after{
content:"";
position:absolute;
bottom:8px;
right:8%;
width:90px;height:2px;
background:linear-gradient(90deg,transparent,var(--accent),transparent);
opacity:0.35;
}

.list-header-inner{
display:flex;
align-items:center;
gap:18px;
position:relative;
z-index:2;
}

.vinyl{
width:110px;
height:110px;
flex-shrink:0;
position:relative;
filter:drop-shadow(0 4px 14px rgba(192,132,252,0.30));
}
.vinyl svg{
width:100%;
height:100%;
}

.list-header-text{
flex:1;
min-width:0;
}
.list-header h1{
font-size:27px;
font-weight:bold;
color:var(--main-light);
line-height:1.35;
letter-spacing:1px;
text-shadow:0 0 16px rgba(192,132,252,0.42);
}
.list-header .sub{
font-size:16px;
color:var(--text-mid);
margin-top:8px;
letter-spacing:0.5px;
}

.search-sticky-wrap{
position:sticky;
top:0;
z-index:12;
background:rgba(3,7,18,0.88);
backdrop-filter:blur(22px);
-webkit-backdrop-filter:blur(22px);
padding:12px 0 14px;
box-shadow:none;
}
.search-box{
margin:0 18px;
position:relative;
}
.search-box input{
width:100%;
padding:13px 46px 13px 40px;
border-radius:30px;
border:1px solid var(--border);
background:linear-gradient(135deg,rgba(192,132,252,0.09),rgba(192,132,252,0.04));
font-size:15px;
outline:none;
color:var(--text);
box-shadow:var(--shadow-soft);
}
.search-box input::placeholder{color:var(--text-light)}
.search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--text-mid)}
.search-clear{
position:absolute;right:14px;
top:50%;
transform:translateY(-50%);
width:24px;height:24px;
border-radius:50%;
background:rgba(192,132,252,0.14);
color:#fff;
display:flex;align-items:center;justify-content:center;
font-size:15px;
cursor:pointer;
backdrop-filter:blur(4px);
}

.section-title{
padding:0 20px;
margin-bottom:12px;
font-size:13px;
color:var(--text-mid);
display:flex;
align-items:center;
gap:10px;
}
.section-title::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--border),transparent)}

.song-list{padding:0 18px 40px}

.song-item{
position:relative;
overflow:hidden;
background:linear-gradient(135deg,rgba(192,132,252,0.08),rgba(192,132,252,0.04));
border-radius:var(--radius);
padding:16px 16px;
margin-bottom:12px;
box-shadow:var(--shadow-soft);
display:flex;
align-items:center;
gap:14px;
cursor:pointer;
border:1px solid var(--border);
transition:all 0.24s ease;
backdrop-filter:blur(8px);
}
.song-item::before{
content:"";
position:absolute;
top:0;
left:-100%;
width:100%;
height:100%;
background:linear-gradient(90deg,transparent,rgba(192,132,252,0.16),transparent);
transition:left 0.45s ease;
}
.song-item:active{
transform:scale(0.97);
box-shadow:var(--shadow-glow);
background:var(--card-strong);
}
.song-item:active::before{
left:100%;
}

.song-index{
padding:3px 10px;
border-radius:8px;
font-size:12px;
font-weight:bold;
flex-shrink:0;
background:rgba(192,132,252,0.24);
color:var(--main-light);
min-width:36px;
text-align:center;
}
.song-name{
font-size:16px;
font-weight:bold;
color:var(--text);
flex:1;
min-width:0;
font-family:"SimSun","宋体","Songti SC","Noto Serif CJK SC","Source Han Serif SC",serif;
}
.song-arrow{color:var(--text-mid)}

/* 歌单列表播放按钮：极简小尺寸，弱化视觉 */
.play-btn-list{
width:28px;
height:28px;
flex-shrink:0;
border-radius:50%;
border:1px solid rgba(192,132,252,0.24);
background:transparent;
color:var(--main-light);
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
transition:all .2s;
}
.play-btn-list svg{width:14px;height:14px;}
.play-btn-list:active{
transform:scale(0.92);
background:rgba(192,132,252,0.20);
box-shadow:0 0 12px rgba(192,132,252,0.35);
}

.empty-state{text-align:center;padding:60px 20px;color:var(--text-light);font-size:14px;}

/* ==========歌词详情页 ========== */
#detail-page{
background:
radial-gradient(circle at 15% 12%, rgba(192,132,252,0.24) 0%, transparent 55%),
radial-gradient(circle at 85% 88%, rgba(236,72,153,0.16) 0%, transparent 55%),
linear-gradient(18deg,#020617 0%,#030712 45%,#0a0f1a 100%);
position:relative;
padding-left:max(18px, env(safe-area-inset-left));
padding-right:max(18px, env(safe-area-inset-right));
padding-bottom:140px;
}
#detail-page::before{
content:"";
position:absolute;
top:-100px;left:-90px;
width:260px;height:260px;
background:radial-gradient(circle, rgba(192,132,252,0.18) 0%,transparent 70%);
pointer-events:none;
}
#detail-page::after{
content:"";
position:absolute;
bottom:-120px;right:-100px;
width:300px;height:300px;
background:radial-gradient(circle, rgba(236,72,153,0.14) 0%,transparent 70%);
pointer-events:none;
}

.float-back-btn{
position:fixed;
top:18px;
left:18px;
z-index:99;
width:42px;height:42px;
border-radius:50%;
border:1px solid var(--border);
background:rgba(192,132,252,0.08);
backdrop-filter:blur(16px);
-webkit-backdrop-filter:blur(16px);
display:flex;align-items:center;justify-content:center;
cursor:pointer;
box-shadow:0 4px 16px rgba(0,0,0,0.35);
transition:transform 0.2s ease,background 0.2s ease;
}
.float-back-btn:active{
transform:scale(0.92);
background:rgba(192,132,252,0.16);
}
.float-back-btn svg{width:21px;height:21px;color:var(--main-light)}

.detail-hero{
padding:24px 0 14px;
text-align:center;
position:relative;
z-index:2;
display:flex;
align-items:center;
justify-content:center;
gap:10px;
}
.detail-hero h1{
font-size:28px;
font-weight:bold;
color:var(--main-light);
letter-spacing:2px;
text-shadow:0 0 18px rgba(192,132,252,0.45);
}
/* 详情页顶部播放按钮：缩小尺寸，极简 */
.play-btn-detail{
width:32px;
height:32px;
flex-shrink:0;
border-radius:50%;
border:1px solid rgba(192,132,252,0.30);
background:linear-gradient(135deg,var(--main),var(--main-dark));
color:#fff;
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
transition:all .2s;
box-shadow:0 0 8px rgba(192,132,252,0.28);
}
.play-btn-detail svg{width:16px;height:16px;}
.play-btn-detail:active{transform:scale(0.92);background:rgba(192,132,252,0.30)}

/* 详情页歌词区域：大面板，无高亮 */
.lyrics-body{
position:relative;
z-index:2;
max-width:420px;
width:100%;
margin:0 auto 40px;
padding:32px max(24px,env(safe-area-inset-left)) 32px max(24px,env(safe-area-inset-right));
border-radius:24px;
background:linear-gradient(135deg,rgba(192,132,252,0.09),rgba(192,132,252,0.04));
backdrop-filter:blur(20px);
-webkit-backdrop-filter:blur(20px);
line-height:2.7;
font-size:17px;
color:var(--text-soft);
font-family:"SimSun","宋体","Songti SC","Noto Serif CJK SC","Source Han Serif SC",serif;
white-space:pre-wrap;
text-align:center;
border:1px solid var(--border);
box-shadow:
0 10px 28px rgba(192,132,252,0.20),
0 4px 12px rgba(0,0,0,0.35);
max-height:none;
height:auto;
overflow:visible;
}
.lyrics-body::before{
content:"";
position:absolute;
top:0;
left:0;
right:0;
height:1px;
background:linear-gradient(90deg,transparent,var(--main),transparent);
opacity:0.55;
}

.detail-nav{
position:fixed;
bottom:0;left:0;right:0;
padding:14px 18px 30px;
background:linear-gradient(0deg,rgba(2,6,23,0.96) 55%,transparent);
display:flex;
gap:14px;
z-index:20;
}
.nav-col{
width:calc(50% - 7px);
max-width:100%;
flex:none;
}
.nav-btn{
width:100%;
max-width:100%;
padding:13px 10px;
border-radius:30px;
border:1px solid var(--border);
background:rgba(192,132,252,0.08);
font-size:14px;
font-weight:bold;
color:var(--text);
display:flex;
align-items:center;
justify-content:center;
gap:6px;
cursor:pointer;
box-shadow:0 3px 12px rgba(0,0,0,0.25);
backdrop-filter:blur(8px);
transition:transform 0.2s ease;
}
.nav-btn:active{transform:scale(0.96)}
.nav-btn.primary{
background:linear-gradient(135deg,var(--main),var(--main-dark));
color:#fff;
border-color:transparent;
box-shadow:0 4px 18px rgba(192,132,252,0.30);
}
.nav-btn:disabled{opacity:0.32;cursor:not-allowed;transform:none;box-shadow:none}
.nav-btn svg{width:16px;height:16px;flex-shrink:0;}
.btn-text{
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
min-width:0;
}

/* 迷你横向悬浮播放器｜紫调优化 */
.floating-player{
position:fixed;
right:14px;
bottom:110px;
z-index:999;
width:auto;
max-width:240px;
border-radius:10px;
background:linear-gradient(135deg,rgba(30,27,75,0.92),rgba(3,7,18,0.94));
border:1px solid rgba(192,132,252,0.28);
backdrop-filter:blur(20px);
-webkit-backdrop-filter:blur(20px);
box-shadow:0 6px 22px rgba(0,0,0,0.42),0 0 16px rgba(192,132,252,0.20);
padding:8px 10px;
display:none;
align-items:center;
gap:8px;
}
.floating-player.show{display:flex;}
.fp-title{
font-size:13px;
color:var(--main-light);
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
font-family:"SimSun","宋体","Songti SC",serif;
max-width:5.2em; /* 限制5个汉字宽度 */
}
.fp-btn{
height:32px;
min-width:32px;
border-radius:8px;
border:1px solid rgba(192,132,252,0.24);
background:rgba(192,132,252,0.10);
color:var(--text);
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
transition:.2s;
flex-shrink:0;
}
.fp-btn svg{width:15px;height:15px;}
.fp-btn:active{transform:scale(0.94);background:rgba(192,132,252,0.22)}
.fp-btn.close{
background:rgba(236,72,153,0.12);
border-color:rgba(236,72,153,0.22);
}
</style>
</head>
<body>
<div id="app">
<div id="list-page" class="page active">
<div class="list-header">
<div class="list-header-inner">
<div class="vinyl">
<svg viewBox="0 0 100 100" fill="none">
<defs>
<radialGradient id="vinylBase" cx="50%" cy="50%" r="50%">
<stop offset="0%" stop-color="#1e1b4b" />
<stop offset="48%" stop-color="#0f172a" />
<stop offset="100%" stop-color="#020617" />
</radialGradient>

<stop offset="0%" stop-color="#e9d5ff" />
<stop offset="50%" stop-color="#c084fc" />
<stop offset="100%" stop-color="#581c87" />
</linearGradient>
<linearGradient id="vinylLine" x1="0%" y1="0%" x2="100%" y2="0%">
<stop offset="0%" stop-color="transparent" />
<stop offset="50%" stop-color="rgba(192,132,252,0.55)" />
<stop offset="100%" stop-color="transparent" />
</linearGradient>
</defs>
<circle cx="50" cy="50" r="48" fill="url(#vinylBase)" stroke="url(#vinylTeal)" stroke-width="1.6"/>
<circle cx="50" cy="50" r="38" stroke="url(#vinylLine)" stroke-width="0.6"/>
<circle cx="50" cy="50" r="26" stroke="url(#vinylLine)" stroke-width="0.6"/>
<circle cx="50" cy="50" r="14" stroke="url(#vinylLine)" stroke-width="0.6"/>
<circle cx="50" cy="50" r="6" fill="url(#vinylTeal)"/>
</svg>
</div>
<div class="list-header-text">
<h1>周杰伦｜演唱会</h1>
<div class="sub">歌词速查手册</div>
</div>
</div>
</div>
<div class="search-sticky-wrap" id="stickyBar">
<div class="search-box">
<svg class="search-icon" viewBox="0 0 24 24" fill="none"><path d="M11.5 3C16.1944 3 20 6.80558 20 11.5C20 13.523 19.2933 15.381 18.1132 16.8404L21.1364 19.8636C21.4879 20.2151 21.4879 20.7849 21.1364 21.1364C20.7849 21.4879 20.2151 21.4879 19.8636 21.1364L16.8404 18.1132C15.381 19.2933 13.523 20 11.5 20C6.80558 20 3 16.1944 3 11.5C3 6.80558 6.80558 3 11.5 3ZM11.5 18.2C15.2003 18.2 18.2 15.2003 18.2 11.5C18.2 7.79969 15.2003 4.8 11.5 4.8C7.79969 4.8 4.8 7.79969 4.8 11.5C4.8 15.2003 7.79969 18.2 11.5 18.2Z" fill="currentColor" /></svg>
<input type="text" id="searchInput" placeholder="搜索歌名或歌词…" oninput="filterSongs()">
<div class="search-clear" id="searchClear" onclick="clearSearch()">×</div>
</div>
</div>
<div class="section-title" id="listTitle">全部 <span id="totalCount">0</span>首</div>
<div class="song-list" id="songList"></div>
</div>

<div id="detail-page" class="page">
<div class="float-back-btn" onclick="goPage('list-page')">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg>
</div>
<div class="detail-hero">
<h1 id="songSubTitle"></h1>
<div class="play-btn-detail" id="playBtnDetail" title="播放/暂停">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
<polygon points="5 3 19 12 5 21 5 3"></polygon>
</svg>
</div>
</div>
<div class="lyrics-body" id="lyricsBody"></div>

<div class="detail-nav">
    <div class="nav-col">
        <button class="nav-btn" id="btnPrev" onclick="prevSong()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M5 12l7-7M5 12l7 7" /></svg>
            <span class="btn-text" id="btnPrevText">上一首</span>
        </button>
    </div>
    <div class="nav-col">
        <button class="nav-btn primary" id="btnNext" onclick="nextSong()">
            <span class="btn-text" id="btnNextText">下一首</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M19 12l-7-7M19 12l-7 7" /></svg>
        </button>
    </div>
</div>
</div>
</div>

<!-- 优化后迷你悬浮播放器 -->
<div class="floating-player" id="floatingPlayer">
    <div class="fp-title" id="fpTitle">七里香</div>
    <div class="fp-btn" id="fpPlayPause" title="播放/暂停">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="5 3 19 12 5 21 5 3"></polygon>
        </svg>
    </div>
    <div class="fp-btn close" id="fpClose" title="停止播放">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M6 6L18 18M18 6L6 18"></path>
        </svg>
    </div>
</div>

        p.scrollTop = 0;

    const activePage = document.getElementById(pageId);
    activePage.classList.add('active');

            <span class="song-arrow">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M9 18l6-6-6-6" />
                </svg>
            </span>`;
        div.onclick = (e)=>{
            if(e.target.closest(".play-btn-list")) return;
            currentSongIdx = realIndex;
            renderLyric();
            goPage('detail-page');
        };
        div.querySelector(".play-btn-list").addEventListener("click",(e)=>{
            e.stopPropagation();
            playSong(realIndex);
        })
        songListBox.appendChild(div);
    })
}

function renderLyric(){
    if(!songs.length) return;
    const song = songs[currentSongIdx];
    songSubTitle.innerText = song.name;
    lyricText.innerText = song.lyrics;
    detailPageEl.scrollTop = 0;

    if(currentSongIdx>0){
        btnPrevText.innerText = `上一首《${songs[currentSongIdx-1].name}》`;
    }else{
        btnPrevText.innerText = `上一首`;
    }
    if(currentSongIdx < songs.length-1){
        btnNextText.innerText = `下一首《${songs[currentSongIdx+1].name}》`;
    }else{
        btnNextText.innerText = `下一首`;
    }

    btnPrev.disabled = currentSongIdx <= 0;
    btnNext.disabled = currentSongIdx >= songs.length - 1;
}

function prevSong(){
    if(currentSongIdx > 0){
        currentSongIdx -=1;
        renderLyric();
    }
}

function nextSong(){
    if(currentSongIdx < songs.length - 1){
        currentSongIdx +=1;
        renderLyric();
    }
}

function filterSongs(){
    const kw = searchInput.value.trim().toLowerCase();
    let arr = [...songs];
    if(kw){
        arr = arr.filter(s=> s.name.toLowerCase().includes(kw) || s.lyrics.toLowerCase().includes(kw));
    }
    renderSongList(arr);
}

function playSong(idx){
    const song = songs[idx];
    if(currentPlaySongIdx === idx && audioPlayer){
        if(audioPlayer.paused){
            audioPlayer.play();
        }else{
            audioPlayer.pause();
        }
        updatePlayPauseIcon();
        return;
    }
    stopAudio();
    currentPlaySongIdx = idx;
    audioPlayer = new Audio(song.audioUrl);
    audioPlayer.autoplay = true;
    floatingPlayer.classList.add("show");
    fpTitle.innerText = song.name;
    audioPlayer.play().catch(err=>{
        console.warn("浏览器自动播放限制，需要点击页面后播放",err);
    })
    audioPlayer.addEventListener("ended",()=>{
        stopAudio();
    })
    updatePlayPauseIcon();
}

function stopAudio(){
    if(audioPlayer){
        audioPlayer.pause();
        audioPlayer.src = "";
        audioPlayer.removeAttribute("src");
        audioPlayer = null;
    }
    currentPlaySongIdx = -1;
    floatingPlayer.classList.remove("show");
}

function updatePlayPauseIcon(){
    if(!audioPlayer){
        fpPlayPause.innerHTML = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>`;
        playBtnDetail.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>`;
        return;
    }
    if(audioPlayer.paused){
        fpPlayPause.innerHTML = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>`;
        playBtnDetail.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>`;
    }else{
        fpPlayPause.innerHTML = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>`;
        playBtnDetail.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>`;
    }
}

fpPlayPause.addEventListener("click",()=>{
    if(!audioPlayer || currentPlaySongIdx === -1) return;
    if(audioPlayer.paused){
        audioPlayer.play();
    }else{
        audioPlayer.pause();
    }
    updatePlayPauseIcon();
})

fpClose.addEventListener("click",()=>{
    stopAudio();
})

playBtnDetail.addEventListener("click",()=>{
    playSong(currentSongIdx);
})

renderSongList(songs);
if(songs.length>0) renderLyric();
</script>
</body>
</html>
