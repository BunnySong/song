<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>周深「深深的」演唱会歌词本</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
--main:#4a90e2;
--main-dark:#255a9c;
--main-darker:#142e5b;
--main-light:#a4c8ff;
--accent:#7b61ff;
--bg-base:#081220;
--bg-deep:#050b18;
--card:rgba(255,255,255,0.06);
--card-strong:rgba(255,255,255,0.09);
--text:#e6edf3;
--text-soft:#c5d1dd;
--text-mid:#8fa3b8;
--text-light:#5e7790;
--border:rgba(255,255,255,0.10);
--radius:18px;
--shadow-soft: 0 4px 18px rgba(74,144,226,0.18);
--shadow-glow: 0 8px 24px rgba(74,144,226,0.28);
--glow: 0 0 18px rgba(74,144,226,0.35);
}
.font-songti{
font-family:
"SimSun",
"宋体",
"Songti SC",
"PingFang SC",
"Noto Serif CJK SC",
"Source Han Serif SC",
"Microsoft YaHei",
sans-serif;
}
html,body{
font-family:"SimSun","宋体",system-ui,-apple-system,BlinkMacSystemFont,Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
background:var(--bg-base);
color:var(--text);
height:100%;
overflow:hidden;
}
#app{
width:100%;
height:100%;
position:relative;
}
.page{
width:100%;
height:100%;
position:absolute;
top:0;
left:0;
display:none;
overflow-y:auto;
overflow-x:hidden;
-webkit-overflow-scrolling:touch;
}
.page.active{
display:block;
}

/* ==========首页标题区域 ========== */
#list-page{
position:relative;
}
#list-page::before{
content:"";
position:absolute;
top:-140px;
right:-120px;
width:360px;height:360px;
background:radial-gradient(circle, rgba(74,144,226,0.35) 0%, transparent 70%);
pointer-events:none;
animation:breath 8s ease-in-out infinite alternate;
}
#list-page::after{
content:"";
position:absolute;
bottom:-160px;
left:-100px;
width:320px;height:320px;
background:radial-gradient(circle, rgba(123,97,255,0.25) 0%, transparent 70%);
pointer-events:none;
animation:breath 9s ease-in-out infinite alternate-reverse;
}
@keyframes breath{
0%{opacity:0.5;transform:scale(1)}
100%{opacity:1;transform:scale(1.12)}
}
.list-header{
position:relative;
padding:50px 22px 24px;
background:linear-gradient(180deg,rgba(20,46,91,0.95) 0%,rgba(8,18,32,0) 100%);
overflow:hidden;
}
.list-header::before{
content:"☆";
position:absolute;
top:20px;
left:8%;
font-size:24px;
color:rgba(74,144,226,0.25);
}
.list-header::after{
content:"✦";
position:absolute;
bottom:6px;
right:10%;
font-size:28px;
color:rgba(123,97,255,0.20);
}
.list-header-inner{
display:flex;
align-items:center;
gap:18px;
position:relative;
z-index:2;
}
.tape{
width:106px;
height:70px;
flex-shrink:0;
position:relative;
filter:drop-shadow(0 2px 8px rgba(74,144,226,0.25));
}
.tape svg{
width:100%;
height:100%;
}
.list-header-text{
flex:1;
min-width:0;
}
.list-header h1{
font-size:27px;
font-weight:bold;
color:var(--main-light);
line-height:1.35;
letter-spacing:1px;
font-family:"SimSun","宋体","Songti SC","PingFang SC","Noto Serif CJK SC",serif;
text-shadow:0 0 14px rgba(74,144,226,0.45);
}
.list-header .sub{
font-size:16px;
color:var(--text-mid);
margin-top:8px;
letter-spacing:0.5px;
font-family:"SimSun","宋体","Songti SC","PingFang SC","Noto Serif CJK SC",serif;
}
/* 搜索吸顶栏：无阴影，深色适配 */
.search-sticky-wrap{
position:sticky;
top:0;
z-index:12;
background:rgba(8,18,32,0.82);
backdrop-filter:blur(18px);
-webkit-backdrop-filter:blur(18px);
padding:12px 0 14px;
box-shadow:none;
}
.search-box{
margin:0 18px;
position:relative;
}
.search-box input{
width:100%;
padding:13px 46px 13px 40px;
border-radius:30px;
border:1px solid var(--border);
background:rgba(255,255,255,0.08);
font-size:15px;
outline:none;
color:var(--text);
font-family:"SimSun","宋体","Songti SC","PingFang SC","Noto Serif CJK SC",serif;
box-shadow:var(--shadow-soft);
}
.search-box input::placeholder{color:var(--text-light)}
.search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--text-mid)}
.search-clear{
position:absolute;right:14px;
top:50%;
transform:translateY(-50%);
width:24px;height:24px;
border-radius:50%;
background:rgba(255,255,255,0.12);
color:#fff;
display:flex;align-items:center;justify-content:center;
font-size:15px;
cursor:pointer;
backdrop-filter:blur(4px);
}
.section-title{padding:0 20px;margin-bottom:12px;font-size:13px;color:var(--text-mid);display:flex;align-items:center;gap:10px;font-family:"SimSun","宋体","Songti SC","PingFang SC","Noto Serif CJK SC",serif;}
.section-title::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--border),transparent)}
.song-list{padding:0 18px 40px}
.song-item{
background:var(--card);
border-radius:var(--radius);
padding:16px 16px;
margin-bottom:12px;
box-shadow:var(--shadow-soft);
display:flex;
align-items:center;
gap:14px;
cursor:pointer;
font-family:"SimSun","宋体","Songti SC","PingFang SC","Noto Serif CJK SC",serif;
border:1px solid var(--border);
transition:all 0.24s ease;
backdrop-filter:blur(8px);
}
.song-item:active{
transform:scale(0.97);
box-shadow:var(--shadow-glow);
background:var(--card-strong);
}
.song-index{
padding:3px 10px;
border-radius:8px;
font-size:12px;
font-weight:bold;
flex-shrink:0;
background:rgba(74,144,226,0.22);
color:var(--main-light);
min-width:36px;
text-align:center;
font-family:"SimSun","宋体","Songti SC","PingFang SC","Noto Serif CJK SC",serif;
}
.song-name{font-size:16px;font-weight:bold;color:var(--text);flex:1;min-width:0;font-family:"SimSun","宋体","Songti SC","PingFang SC","Noto Serif CJK SC",serif;}
.song-arrow{color:var(--text-mid)}
.empty-state{text-align:center;padding:60px 20px;color:var(--text-light);font-size:14px;font-family:"SimSun","宋体","Songti SC","PingFang SC","Noto Serif CJK SC",serif;}

/* ==========歌词详情页 深海星空主题 ========== */
#detail-page{
background:
radial-gradient(circle at 15% 12%, rgba(74,144,226,0.22) 0%, transparent 55%),
radial-gradient(circle at 85% 88%, rgba(123,97,255,0.16) 0%, transparent 55%),
linear-gradient(18deg,#050b18 0%,#081220 45%,#0a182b 100%);
position:relative;
padding-left:max(18px, env(safe-area-inset-left));
padding-right:max(18px, env(safe-area-inset-right));
padding-bottom:140px;
}
#detail-page::before{
content:"";
position:absolute;
top:-100px;left:-90px;
width:260px;height:260px;
background:radial-gradient(circle, rgba(74,144,226,0.18) 0%,transparent 70%);
pointer-events:none;
}
#detail-page::after{
content:"";
position:absolute;
bottom:-120px;right:-100px;
width:300px;height:300px;
background:radial-gradient(circle, rgba(123,97,255,0.14) 0%,transparent 70%);
pointer-events:none;
}
.float-back-btn{
position:fixed;
top:18px;
left:18px;
z-index:99;
width:42px;height:42px;
border-radius:50%;
border:1px solid rgba(255,255,255,0.12);
background:rgba(255,255,255,0.08);
backdrop-filter:blur(16px);
-webkit-backdrop-filter:blur(16px);
display:flex;align-items:center;justify-content:center;
cursor:pointer;
box-shadow:0 4px 16px rgba(0,0,0,0.35);
transition:transform 0.2s ease,background 0.2s ease;
}
.float-back-btn:active{
transform:scale(0.92);
background:rgba(255,255,255,0.16);
}
.float-back-btn svg{width:21px;height:21px;color:#e6edf3}

/* 标题区 */
.detail-hero{
padding:24px 0 14px;
text-align:center;
position:relative;
z-index:2;
}
.detail-hero h1{
font-size:28px;
font-weight:bold;
color:var(--main-light);
font-family:"SimSun","宋体","Songti SC","PingFang SC","Noto Serif CJK SC",serif;
letter-spacing:2px;
text-shadow:0 0 18px rgba(74,144,226,0.55);
}

.lyrics-body{
position:relative;
z-index:2;
max-width:380px;
width:100%;
margin:0 auto 40px;
padding:32px max(24px,env(safe-area-inset-left)) 32px max(24px,env(safe-area-inset-right));
border-radius:24px;
background:var(--card);
backdrop-filter:blur(20px);
-webkit-backdrop-filter:blur(20px);
line-height:2.6;
font-size:17px;
color:var(--text-soft);
white-space:pre-wrap;
text-align:center;
font-family:"SimSun","宋体","Songti SC","PingFang SC","Noto Serif CJK SC",serif;
border:1px solid var(--border);
box-shadow:
0 10px 28px rgba(74,144,226,0.18),
0 4px 12px rgba(0,0,0,0.30);
}

/* 底部操作栏：两列各占一半，保留间隙 */
.detail-nav{
position:fixed;
bottom:0;left:0;right:0;
padding:14px 18px 30px;
background:linear-gradient(0deg,rgba(5,11,24,0.94) 55%,transparent);
display:flex;
gap:14px;
z-index:20;
}
.nav-col{
width:calc(50% - 7px);
max-width:100%;
flex:none;
}
.nav-btn{
width:100%;
max-width:100%;
padding:13px 10px;
border-radius:30px;
border:1px solid var(--border);
background:rgba(255,255,255,0.08);
font-size:14px;
font-weight:bold;
color:var(--text);
display:flex;
align-items:center;
justify-content:center;
gap:6px;
cursor:pointer;
box-shadow:0 3px 12px rgba(0,0,0,0.25);
font-family:"SimSun","宋体","Songti SC","PingFang SC","Noto Serif CJK SC",serif;
backdrop-filter:blur(8px);
transition:transform 0.2s ease;
}
.nav-btn:active{transform:scale(0.96)}
.nav-btn.primary{
background:linear-gradient(135deg,var(--main),var(--main-dark));
color:#fff;
border-color:transparent;
box-shadow:0 4px 18px rgba(74,144,226,0.35);
}
.nav-btn:disabled{opacity:0.32;cursor:not-allowed;transform:none;box-shadow:none}
.nav-btn svg{width:16px;height:16px;flex-shrink:0;}
/* 文字容器单独做溢出省略，图标不会被挤压 */
.btn-text{
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
min-width:0;
}
</style>
</head>

<div class="detail-nav">

    </div>
</div>
</div>

let currentSongIdx = 0;
const songListBox = document.getElementById('songList');
const songSubTitle = document.getElementById('songSubTitle');
const lyricText = document.getElementById('lyricsBody');
const btnPrev = document.getElementById('btnPrev');
const btnNext = document.getElementById('btnNext');
const btnPrevText = document.getElementById('btnPrevText');
const btnNextText = document.getElementById('btnNextText');
const searchInput = document.getElementById('searchInput');
const detailPageEl = document.getElementById('detail-page');
const totalCountEl = document.getElementById('totalCount');

function goPage(pageId){
    document.querySelectorAll('.page').forEach(p=>{
        p.classList.remove('active');
        p.scrollTop = 0;
    });
    const activePage = document.getElementById(pageId);
    activePage.classList.add('active');
    activePage.scrollTop = 0;
}

function clearSearch(){
    searchInput.value = '';
    filterSongs();
}

function renderSongList(list){
    songListBox.innerHTML = '';
    totalCountEl.innerText = songs.length;
    if(!list.length){
        songListBox.innerHTML = `<div class="empty-state">没有找到相关歌曲</div>`;
        return;
    }
    list.forEach((item)=>{
        const realIndex = songs.indexOf(item);
        const div = document.createElement('div');
        div.className = 'song-item';
        div.innerHTML = `
            <span class="song-index">${realIndex+1}</span>
            <span class="song-name">${item.name}</span>
            <span class="song-arrow">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M9 18l6-6-6-6" />
                </svg>
            </span>`;
        div.onclick = ()=>{
            currentSongIdx = realIndex;
            renderLyric();
            goPage('detail-page');
        };
        songListBox.appendChild(div);
    })
}

function renderLyric(){
    if(!songs.length) return;
    const song = songs[currentSongIdx];
    songSubTitle.innerText = song.name;
    lyricText.innerText = song.lyrics;
    detailPageEl.scrollTop = 0;

    if(currentSongIdx>0){
        btnPrevText.innerText = `上一首《${songs[currentSongIdx-1].name}》`;
    }else{
        btnPrevText.innerText = `上一首`;
    }
    if(currentSongIdx < songs.length-1){
        btnNextText.innerText = `下一首《${songs[currentSongIdx+1].name}》`;
    }else{
        btnNextText.innerText = `下一首`;
    }

    btnPrev.disabled = currentSongIdx <= 0;
    btnNext.disabled = currentSongIdx >= songs.length - 1;
}

function prevSong(){
    if(currentSongIdx > 0){
        currentSongIdx -=1;
        renderLyric();
    }
}
function nextSong(){
    if(currentSongIdx < songs.length - 1){
        currentSongIdx +=1;
        renderLyric();
    }
}

function filterSongs(){
    const kw = searchInput.value.trim().toLowerCase();
    let arr = [...songs];
    if(kw){
        arr = arr.filter(s=> s.name.toLowerCase().includes(kw) || s.lyrics.toLowerCase().includes(kw));
    }
    renderSongList(arr);
}

renderSongList(songs);
if(songs.length>0) renderLyric();
</script>
